const db = supabase.createClient(SB_URL, SB_KEY);

async function dbSave(z) {
  try {
    const { data } = await db.from('zones_history').insert([{
      asset:'BTCUSDT', timeframe:'15m',
      zone_type: z.type, zone_top: z.top, zone_bottom: z.bottom,
      zone_height: z.top - z.bottom, atr_value: z.atr,

async function dbProb(type, height, trend) {
  try {
    const { data } = await db.from('zones_history')
      .select('result')
      .eq('zone_type', type).eq('trend_context', trend)
      .gte('zone_height', height * 0.8).lte('zone_height', height * 1.2)
      .neq('result','pending').limit(100);
    if (!data || !data.length) return null;
    const r = data.filter(x => x.result === 'respected').length;
    return { pct: Math.round(r / data.length * 100), total: data.length };
  } catch(e) { return null; }
}

async function dbUpdate(id, result) {

/* ════════════════════════════════════════════════
   INDICADORES (Pine Script v0.6.1 traducción fiel)
════════════════════════════════════════════════ */

function calcATR(cs, period) {
  period = period || 14;
  const n = cs.length;
  const trs = [];
  for (let i = 1; i < n; i++) {
    const c = cs[i], p = cs[i-1];
    trs.push(Math.max(c.high - c.low, Math.abs(c.high - p.close), Math.abs(c.low - p.close)));
  }
  const out = new Array(n).fill(NaN);
  if (trs.length < period) return out;
  let s = 0;
  for (let i = 0; i < period; i++) s += trs[i];
  out[period] = s / period;
  for (let i = period; i < trs.length; i++) out[i+1] = (out[i] * (period-1) + trs[i]) / period;
  return out;
}

function pivotHighs(cs, len) {
  len = len || 5;
  const out = [];
  for (let i = len; i < cs.length - len; i++) {
    const h = cs[i].high; let ok = true;
    for (let j = i-len; j <= i+len && ok; j++) if (j!==i && cs[j].high >= h) ok = false;
    if (ok) out.push({ index:i, price:h });
  }
  return out;
}

function pivotLows(cs, len) {
  len = len || 5;
  const out = [];
  for (let i = len; i < cs.length - len; i++) {
    const l = cs[i].low; let ok = true;
    for (let j = i-len; j <= i+len && ok; j++) if (j!==i && cs[j].low <= l) ok = false;
    if (ok) out.push({ index:i, price:l });
  }
  return out;
}

function getH(cs, atrs, pivs) {
  const n = cs.length, cl = cs[n-1].close, atr = atrs[n-1];
  if (!atr || isNaN(atr)) return null;
  let best = null, bd = Infinity;
  for (const p of pivs) {
    const age = n-1-p.index, d = p.price - cl;
    if (age <= 80 && d > atr*0.1 && d <= atr*5 && d < bd) { best = p.price; bd = d; }
  }
  return best;
}

function getL(cs, atrs, pivs) {
  const n = cs.length, cl = cs[n-1].close, atr = atrs[n-1];
  if (!atr || isNaN(atr)) return null;
  let best = null, bd = Infinity;
  for (const p of pivs) {
    const age = n-1-p.index, d = cl - p.price;
    if (age <= 80 && d > atr*0.1 && d <= atr*5 && d < bd) { best = p.price; bd = d; }
  }
  return best;
}

function detectSupply(cs, atrs) {
  const n = cs.length, atr = atrs[n-1], cur = cs[n-1];
  if (!atr || isNaN(atr)) return null;
  for (let i = 5; i <= 50; i++) {
    const base = n-1-i; if (base < 0) break;
    let bH = cs[base].high, bL = cs[base].low;
    for (let j = 0; j < 5; j++) {
      const idx = n-1-(i-j);
      if (idx >= 0 && idx < n) { bH = Math.max(bH, cs[idx].high); bL = Math.min(bL, cs[idx].low); }
    }
    if (bH-bL <= atr*1.2 && bL-cur.low >= atr*1.0 && cur.close < bL)
      return { type:'supply', top:bH, bottom:bL, leftIndex:base, leftTime:cs[base].time, height:bH-bL, atr };
  }
  return null;
}

function detectDemand(cs, atrs) {
  const n = cs.length, atr = atrs[n-1], cur = cs[n-1];
  if (!atr || isNaN(atr)) return null;
  for (let i = 5; i <= 50; i++) {
    const base = n-1-i; if (base < 0) break;
    let bH = cs[base].high, bL = cs[base].low;
    for (let j = 0; j < 5; j++) {
      const idx = n-1-(i-j);
      if (idx >= 0 && idx < n) { bH = Math.max(bH, cs[idx].high); bL = Math.min(bL, cs[idx].low); }
    }
    if (bH-bL <= atr*1.2 && cur.high-bH >= atr*1.0 && cur.close > bH)
      return { type:'demand', top:bH, bottom:bL, leftIndex:base, leftTime:cs[base].time, height:bH-bL, atr };
  }
  return null;
}

function invalidated(zone, cs, atrs) {
  const atr = atrs[cs.length-1];
  if (!atr || isNaN(atr)) return false;
  const cl = cs[cs.length-1].close, m = atr * 0.1;
  return zone.type === 'supply' ? cl > zone.top + m : cl < zone.bottom - m;
}

function zoneVirgin(zone, cs) {
  for (let i = zone.leftIndex+1; i < cs.length-1; i++) {
    const c = cs[i];
    if (zone.type === 'supply' && c.high >= zone.bottom) return false;
    if (zone.type === 'demand' && c.low  <= zone.top)    return false;
  }
  return true;
}

function trendOf(cs) {
  const n = cs.length; if (n < 5) return 'sideways';
  const a = (cs[n-5].high + cs[n-5].low) / 2;
  const b = (cs[n-1].high + cs[n-1].low) / 2;
  return b > a*1.001 ? 'bullish' : b < a*0.999 ? 'bearish' : 'sideways';
}

// 13:00–19:00 hora España (Europe/Madrid, CET/CEST automático)
const _mfmt = new Intl.DateTimeFormat('es-ES', { timeZone:'Europe/Madrid', hour:'numeric', minute:'numeric', hour12:false });
function isNYS(ms) {
  const p = _mfmt.formatToParts(new Date(ms));
  const h = +p.find(x => x.type==='hour').value;
  const m = +p.find(x => x.type==='minute').value;
  const t = h*60 + m;
  return t >= 780 && t < 1140;
}

/* ════════════════════════════════════════════════
   OVERLAY (zonas + NY session shading)
════════════════════════════════════════════════ */
function drawOverlay() {
  const W = overlayEl.width, H = overlayEl.height;
  octx.clearRect(0, 0, W, H);
  if (!S.candles.length) return;

  const RW = 65; // ancho aprox del eje de precios
  const CW = W - RW;

  function toX(ms) { return chart.timeScale().timeToCoordinate(Math.floor(ms/1000)); }
  function toY(p)  { return candleSeries.priceToCoordinate(p); }

  // ── NY session shading ──
  const vr = chart.timeScale().getVisibleRange();
  if (vr) {
    for (const c of S.candles) {
      if (!isNYS(c.time)) continue;
      const x = toX(c.time);
      if (x === null || x < -20 || x > CW + 20) continue;
      const x2 = toX(c.time + 15*60*1000);
      const bw = x2 !== null ? Math.abs(x2 - x) : 9;
      octx.fillStyle = 'rgba(124,131,255,0.038)';
      octx.fillRect(x, 0, bw, H);
    }
  }

  // ── Supply zone ──
  if (supplyZone) {
    const y1 = toY(supplyZone.top);
    const y2 = toY(supplyZone.bottom);
    if (y1 !== null && y2 !== null) {
      const x1 = toX(supplyZone.leftTime);
      const sx  = x1 !== null ? Math.max(0, x1) : 0;
      octx.fillStyle = 'rgba(239,83,80,0.1)';
      octx.fillRect(sx, y1, CW - sx, y2 - y1);
      octx.strokeStyle = 'rgba(239,83,80,0.65)';
      octx.lineWidth = 1; octx.setLineDash([]);
      octx.beginPath();
      octx.moveTo(sx, y1); octx.lineTo(CW, y1);
      octx.moveTo(sx, y2); octx.lineTo(CW, y2);
      octx.stroke();
      octx.font = '10px JetBrains Mono,monospace';
      octx.fillStyle = 'rgba(239,83,80,0.85)';
      octx.textAlign = 'right';
      octx.fillText('SUPPLY', CW - 5, y1 - 4);
      octx.textAlign = 'left';
    }
  }

  // ── Demand zone ──
  if (demandZone) {
    const y1 = toY(demandZone.top);
    const y2 = toY(demandZone.bottom);
    if (y1 !== null && y2 !== null) {
      const x1 = toX(demandZone.leftTime);
      const sx  = x1 !== null ? Math.max(0, x1) : 0;
      octx.fillStyle = 'rgba(38,166,154,0.1)';
      octx.fillRect(sx, y1, CW - sx, y2 - y1);
      octx.strokeStyle = 'rgba(38,166,154,0.65)';
      octx.lineWidth = 1; octx.setLineDash([]);
      octx.beginPath();
      octx.moveTo(sx, y1); octx.lineTo(CW, y1);
      octx.moveTo(sx, y2); octx.lineTo(CW, y2);
      octx.stroke();
      octx.font = '10px JetBrains Mono,monospace';
      octx.fillStyle = 'rgba(38,166,154,0.85)';
      octx.textAlign = 'right';
      octx.fillText('DEMAND', CW - 5, y2 + 12);
      octx.textAlign = 'left';
    }
  }
}

// Redibujar overlay al mover/zoom el gráfico
chart.timeScale().subscribeVisibleLogicalRangeChange(drawOverlay);
chart.subscribeCrosshairMove(drawOverlay);

/* ════════════════════════════════════════════════
   NIVELES H / L  (líneas nativas de lightweight-charts)
════════════════════════════════════════════════ */
function setLevelLines(h, l) {
  if (hLine) { try { candleSeries.removePriceLine(hLine); } catch(_){} hLine = null; }
  if (lLine) { try { candleSeries.removePriceLine(lLine); } catch(_){} lLine = null; }
  if (h != null) hLine = candleSeries.createPriceLine({ price:h, color:'#ef5350', lineWidth:1, lineStyle:LineStyle.Dashed, axisLabelVisible:true, title:'H' });
  if (l != null) lLine = candleSeries.createPriceLine({ price:l, color:'#26a69a', lineWidth:1, lineStyle:LineStyle.Dashed, axisLabelVisible:true, title:'L' });
  document.getElementById('sb-h').textContent = h != null ? h.toFixed(2) : '—';
  document.getElementById('sb-l').textContent = l != null ? l.toFixed(2) : '—';
}

/* ════════════════════════════════════════════════
   BOS MARKERS (flechas nativas de lightweight-charts)
════════════════════════════════════════════════ */
function addBOS(c, dir) {
  bosMarkers.push({
    time: Math.floor(c.time/1000),
    position: dir==='up' ? 'aboveBar' : 'belowBar',
    color: dir==='up' ? '#26a69a' : '#ef5350',
    shape: dir==='up' ? 'arrowUp' : 'arrowDown',
    text: 'BOS', size: 0.8,
  });
  candleSeries.setMarkers(bosMarkers);
  document.getElementById('st-bos').textContent = (dir==='up'?'↑':'↓') + ' ' + c.close.toFixed(2);
}

/* ════════════════════════════════════════════════
   OHLC LEGEND (actualiza con crosshair)
════════════════════════════════════════════════ */
chart.subscribeCrosshairMove(param => {
  const d = param.seriesData && param.seriesData.get(candleSeries);
  const c = d || S.lastC;
  if (!c) return;
  const ms = d ? param.time * 1000 : (S.lastC ? S.lastC.time : 0);
  const dt = new Date(ms);
  const ts = `${String(dt.getUTCDate()).padStart(2,'0')}/${String(dt.getUTCMonth()+1).padStart(2,'0')} ` +
             `${String(dt.getUTCHours()).padStart(2,'0')}:${String(dt.getUTCMinutes()).padStart(2,'0')} UTC`;
  document.getElementById('l-ts').textContent = ts;
  document.getElementById('l-o').textContent  = (c.open  || 0).toFixed(2);
  document.getElementById('l-h').textContent  = (c.high  || 0).toFixed(2);
  document.getElementById('l-l').textContent  = (c.low   || 0).toFixed(2);
  const lc = document.getElementById('l-c');
  lc.textContent = (c.close || 0).toFixed(2);
  lc.className   = 'lv ' + (c.close >= c.open ? 'up' : 'dn');
  // Volume: lo tenemos en S.candles por timestamp
  if (d && param.time) {
    const ms2 = param.time * 1000;
    const cv = S.candles.find(x => Math.floor(x.time/1000) === param.time);
    document.getElementById('l-v').textContent = cv ? (cv.volume/1000).toFixed(1)+'K' : '—';
  }
});

/* ════════════════════════════════════════════════
   ANÁLISIS COMPLETO
════════════════════════════════════════════════ */
let analyzing = false;
async function analyze() {
  if (analyzing || S.candles.length < 50) return;
  analyzing = true;
  try {
    S.atrs = calcATR(S.candles, 14);
    S.pivH  = pivotHighs(S.candles, 5);
    S.pivL  = pivotLows(S.candles, 5);

    const atr   = S.atrs[S.atrs.length-1];
    const h     = getH(S.candles, S.atrs, S.pivH);
    const l     = getL(S.candles, S.atrs, S.pivL);
    const trend = trendOf(S.candles);

    setLevelLines(h, l);

    // Invalidación
    if (supplyZone && invalidated(supplyZone, S.candles, S.atrs)) {
      await dbUpdate(supplyId, 'broke');
      supplyZone = null; supplyId = null; supplyProb = null;
    }
    if (demandZone && invalidated(demandZone, S.candles, S.atrs)) {
      await dbUpdate(demandId, 'broke');
      demandZone = null; demandId = null; demandProb = null;
    }

    // Supply nueva
    const ns = detectSupply(S.candles, S.atrs);
    if (ns) {
      const diff = !supplyZone || Math.abs(ns.top-supplyZone.top)>1 || Math.abs(ns.bottom-supplyZone.bottom)>1;
      if (diff) {
        supplyZone = ns; supplyZone.isVirgin = zoneVirgin(ns, S.candles); supplyZone.trend = trend;
        const [sv, sp] = await Promise.all([dbSave(supplyZone), dbProb('supply', ns.height, trend)]);
        supplyId = sv && sv.id; supplyProb = sp;
      }
    }

    // Demand nueva
    const nd = detectDemand(S.candles, S.atrs);
    if (nd) {
      const diff = !demandZone || Math.abs(nd.top-demandZone.top)>1 || Math.abs(nd.bottom-demandZone.bottom)>1;
      if (diff) {
        demandZone = nd; demandZone.isVirgin = zoneVirgin(nd, S.candles); demandZone.trend = trend;
        const [dv, dp] = await Promise.all([dbSave(demandZone), dbProb('demand', nd.height, trend)]);
        demandId = dv && dv.id; demandProb = dp;
      }
    }

    // BOS
    if (S.candles.length >= 2) {
      const prev = S.candles[S.candles.length-2];
      const cur  = S.candles[S.candles.length-1];
      const m = (atr || 0) * 0.1;
      if (h != null && cur.close > h+m && prev.close <= h+m) {
        addBOS(cur, 'up');
        if (demandId) await dbUpdate(demandId, 'respected');
      }
      if (l != null && cur.close < l-m && prev.close >= l-m) {
        addBOS(cur, 'down');
        if (supplyId) await dbUpdate(supplyId, 'respected');
      }
    }

    refreshSidebar(atr, trend);
    drawOverlay();

    if (S.candles.length % 20 === 0) loadHistory();

  } finally { analyzing = false; }
}

/* ════════════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════════════ */
function fp(p) { return p != null ? p.toFixed(2) : '—'; }

function refreshSidebar(atr, trend) {
  // Supply
  const sc = document.getElementById('sc');
  if (supplyZone) {
    const p = supplyProb;
    const ph = p ? `<span class="${p.pct>=60?'pl':p.pct<=40?'ph':'pm'}">${p.pct}% respetada</span> / ${p.total} casos` : 'Sin datos históricos';
    sc.className = 'zcard s';
    sc.innerHTML = `<div class="ztype">SUPPLY</div>
      <div class="zrange">${fp(supplyZone.top)} — ${fp(supplyZone.bottom)}</div>
      <div class="zprob">${ph}</div>
      <span class="zbadge ${supplyZone.isVirgin?'vg':'td'}">${supplyZone.isVirgin?'★ VIRGIN':'TOUCHED'}</span>`;
  } else {
    sc.className = 'zcard'; sc.innerHTML = '<div class="ztype">Sin zona activa</div>';
  }

  // Demand
  const dc = document.getElementById('dc');
  if (demandZone) {
    const p = demandProb;
    const ph = p ? `<span class="${p.pct>=60?'ph':p.pct<=40?'pl':'pm'}">${p.pct}% respetada</span> / ${p.total} casos` : 'Sin datos históricos';
    dc.className = 'zcard d';
    dc.innerHTML = `<div class="ztype">DEMAND</div>
      <div class="zrange">${fp(demandZone.top)} — ${fp(demandZone.bottom)}</div>
      <div class="zprob">${ph}</div>
      <span class="zbadge ${demandZone.isVirgin?'vg':'td'}">${demandZone.isVirgin?'★ VIRGIN':'TOUCHED'}</span>`;
  } else {
    dc.className = 'zcard'; dc.innerHTML = '<div class="ztype">Sin zona activa</div>';
  }

  document.getElementById('st-atr').textContent = atr ? atr.toFixed(1) : '—';
  document.getElementById('st-cnt').textContent = S.candles.length;
  const te = document.getElementById('st-trd');
  te.textContent = trend;
  te.style.color = trend==='bullish' ? 'var(--green)' : trend==='bearish' ? 'var(--red)' : 'var(--gold)';
}

async function loadHistory() {
  const data = await dbRecent();
  const el = document.getElementById('hist');
  if (!data.length) { el.innerHTML = '<div style="color:var(--text);font-size:10px">Sin historial aún</div>'; return; }
  el.innerHTML = data.map(z => {
    const d = new Date(z.detected_at);
    const ts = `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')} `+
               `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
    return `<div class="hitem">
      <div class="hdot ${z.zone_type}"></div>
      <div class="hinfo">
        <div class="hprc">${fp(z.zone_top)} — ${fp(z.zone_bottom)}</div>
        <div class="hts">${ts} · ${z.trend_context||'—'}</div>
      </div>
      <span class="hres ${z.result}">${z.result}</span>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════
   HEADER — precio y NY badge
════════════════════════════════════════════════ */
function updatePrice(price) {
  document.getElementById('hp').textContent = price.toFixed(2);
  if (S.openPrice) {
    const pct = (price - S.openPrice) / S.openPrice * 100;
    const el = document.getElementById('hc');
    el.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    el.className = pct >= 0 ? 'up' : 'down';
  }
}

function tickNY() {
  const el = document.getElementById('ny');
  const on = isNYS(Date.now());
  el.className = on ? 'on' : '';
  el.textContent = on ? '● NY SESSION' : 'NY SESSION';
}
setInterval(tickNY, 60000);
tickNY();

/* ════════════════════════════════════════════════
   BINANCE DATA
════════════════════════════════════════════════ */
function kl(k)   { return { time:k[0], open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:+k[5] }; }
function wk(k)   { return { time:k.t,  open:+k.o,  high:+k.h,  low:+k.l,  close:+k.c,  volume:+k.v  }; }
function toLWC(c) { return { time:Math.floor(c.time/1000), open:c.open, high:c.high, low:c.low, close:c.close }; }
function toVol(c) { return { time:Math.floor(c.time/1000), value:c.volume, color:c.close>=c.open?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)' }; }

let ws = null, wsTimer = null;

function wsDot(s) { document.getElementById('wsdot').className = s; }

function connectWS() {
  if (ws) { try { ws.close(); } catch(_){} }
  wsDot('con');
  ws = new WebSocket(WS_ENDPOINT);

  ws.onopen = () => wsDot('ok');

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.e !== 'kline') return;
    const c = wk(msg.k);
    S.lastC = c;
    updatePrice(c.close);
    // Update legend live
    document.getElementById('l-o').textContent = c.open.toFixed(2);
    document.getElementById('l-h').textContent = c.high.toFixed(2);
    document.getElementById('l-l').textContent = c.low.toFixed(2);
    const lc = document.getElementById('l-c'); lc.textContent = c.close.toFixed(2);
    lc.className = 'lv ' + (c.close >= c.open ? 'up' : 'dn');

    const last = S.candles[S.candles.length-1];
    if (last && last.time === c.time) {
      S.candles[S.candles.length-1] = c;
      candleSeries.update(toLWC(c));
      volSeries.update(toVol(c));
    } else {
      S.candles.push(c);
      candleSeries.update(toLWC(c));
      volSeries.update(toVol(c));
      analyze(); // análisis en cada vela nueva confirmada
    }
  };

  ws.onerror = () => wsDot('err');
  ws.onclose = () => {
    wsDot('err');
    clearTimeout(wsTimer);
    wsTimer = setTimeout(connectWS, 5000);
  };
}

/* ════════════════════════════════════════════════
   LOADING
════════════════════════════════════════════════ */
function setMsg(m) { document.getElementById('lmsg').textContent = m; }
function hideLoader() {
  const el = document.getElementById('loading');
  el.classList.add('out');
  setTimeout(() => { try { el.remove(); } catch(_){} }, 600);
}

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
async function init() {
  setMsg('Descargando 500 velas de Binance...');
  let raw;
  try {
    const res = await fetch(REST);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    raw = await res.json();
    if (!Array.isArray(raw) || !raw.length) throw new Error('Sin datos');
  } catch(e) {
    setMsg('Error: ' + e.message + '. Reintentando...');
    setTimeout(init, 4000);
    return;
  }

  S.candles   = raw.map(kl);
  S.openPrice = S.candles[0].open;
  S.lastC     = S.candles[S.candles.length-1];

  // Cargar datos en el gráfico
  candleSeries.setData(S.candles.map(toLWC));
  volSeries.setData(S.candles.map(toVol));
  chart.timeScale().scrollToRealTime();

  setMsg('Calculando zonas...');
  S.atrs = calcATR(S.candles, 14);
  await analyze();

  setMsg('Conectando WebSocket en tiempo real...');
  connectWS();
  await loadHistory();
  updatePrice(S.lastC.close);

  // Timestamp inicial en leyenda
  const dt = new Date(S.lastC.time);
  document.getElementById('l-ts').textContent =
    `${String(dt.getUTCDate()).padStart(2,'0')}/${String(dt.getUTCMonth()+1).padStart(2,'0')} ` +
    `${String(dt.getUTCHours()).padStart(2,'0')}:${String(dt.getUTCMinutes()).padStart(2,'0')} UTC`;

  hideLoader();
}

init();
</script>
